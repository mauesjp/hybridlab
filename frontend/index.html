<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hybridlab-logo.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HybridLab</title>
    <script>
      // Aplica a preferência antes de desenhar a página, evitando flashes de tema.
      try {
        const theme = localStorage.getItem('hybridlab-theme') === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#ffffff' : '#000000'
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
